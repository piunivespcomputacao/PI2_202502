{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm p-4">
  <h3 class="mb-3">Consultar Peça</h3>
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <form action="/analyze" method="post" class="row g-2">
    <div class="col-md-8">
      <input name="id_peca" class="form-control form-control-lg" placeholder="Ex: 1002" required>
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary btn-lg w-100">Analisar</button>
    </div>
  </form>

  <div class="mt-3">
    <a href="{{ url_for('add_piece') }}" class="btn btn-outline-success">➕ Cadastrar nova peça</a>
  </div>

  <hr class="my-4">

  <h5>Como usar</h5>
  <ol>
    <li>Digite o número da peça (id_peca) e clique em <b>Analisar</b>.</li>
    <li>Veja o diagnóstico e as ações recomendadas.</li>
  </ol>
</div>
{% endblock %}
